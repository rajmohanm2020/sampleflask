
version: 0.0
os: linux

files:
  - source: /
    destination: /home/ubuntu/flask-employee-app

permissions:
  - object: /home/ubuntu/flask-employee-app
    owner: ubuntu
    group: ubuntu
    mode: 755
    type:
      - directory

hooks:
  ApplicationStop:
    - location: scripts/stop_application.sh
      timeout: 60
      runas: root

  BeforeInstall:
    - location: scripts/before_install.sh
      timeout: 60
      runas: root

  ApplicationStart:
    - location: scripts/start_application.sh
      timeout: 120
      runas: root
